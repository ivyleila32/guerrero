<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerrero y sus armas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="contenedor">
        <h1>⚔️ El Guerrero</h1>

        <section class="personaje">
            <div class="guerrero" id="muneco"></div>
            <h2 id="nombreGuerrero">Ragnar</h2>
            <span class="etapa" id="etapa">Aprendiz</span>
            <div class="stats">
                <span>Vida</span>
                <div><div class="barra"><i id="barraVida"></i></div><small id="textoVida"></small></div>
                <span>Experiencia</span>
                <div><div class="barra xp"><i id="barraXp"></i></div><small id="textoXp"></small></div>
                <span>Fuerza</span><strong id="fuerza">10</strong>
                <span>Defensa</span><strong id="defensa">1</strong>
            </div>
        </section>

        <section class="arma">
            <h2>Arma equipada</h2>
            <div id="iconoArma" class="icono-arma">⚔️</div>
            <p>Nombre: <strong id="nombreArma">Espada</strong></p>
            <p>Daño: <strong id="danioArma">25</strong></p>
        </section>

        <section>
            <h2>Elegí un arma</h2>
            <div class="botones" id="botonesArmas"></div>
            <button class="atacar" id="btnAtacar">¡Atacar!</button>
            <p id="mensaje">El guerrero está preparado.</p>
        </section>

        <section class="circuito">
            <h2>El circuito</h2>
            <div class="tablero" id="tablero"></div>
            <p class="leyenda">⚔️ armas · 🧪 poción · 🛡️ armadura · 💪 amuleto · ✨ experiencia · 👹 enemigo</p>
            <ul id="registro"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
